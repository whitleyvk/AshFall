- type: entity
  id: BaseWeaponWorn
  abstract: true
  components:
  - type: RandomDefects
  - type: GunJamDefect
    prob: 0.70
    jamChance: 0.06
  - type: GunSpreadDefect
    prob: 0.70
    minAngleMin: 1
    minAngleMax: 3
    maxAngleMin: 6
    maxAngleMax: 12
  - type: BackfireDefect
    prob: 0.15
    backfireChance: 0.03
  - type: AttachableGun
    slots:
    - name: gun-slot-muzzle
      containerId: attachment_muzzle
      whitelist:
        tags:
        - GunAttachmentMuzzle
    - name: gun-slot-underbarrel
      containerId: attachment_underbarrel
      whitelist:
        tags:
        - GunAttachmentUnderbarrel
    - name: gun-slot-optic
      containerId: attachment_optic
      whitelist:
        tags:
        - GunAttachmentOptic

