- type: entity
  parent: BaseItem
  id: BaseGunAttachment
  abstract: true
  components:
  - type: GunAttachment
  - type: Sprite
    netsync: false
  - type: Item
    size: Small

# Muzzle / Suppressors
- type: entity
  parent: BaseGunAttachment
  id: AttachmentSuppressorPistol
  components:
  - type: GunAttachment
    attachedSprite:
      sprite: Ashfall/Objects/Weapons/Attachments/Suppressors/multi_cal.rsi
      state: multical_pistol
    attachedOffset: 0.5, 0
  - type: Sprite
    sprite: Ashfall/Objects/Weapons/Attachments/Suppressors/multi_cal.rsi
    state: multical_pistol
  - type: Tag
    tags:
    - GunAttachmentMuzzle
    - GunAttachmentMuzzlePistol
  - type: GunSoundAttachment
    sound:
      collection: Supressed_1_Gunshots

- type: entity
  parent: BaseGunAttachment
  id: AttachmentSuppressorRifle
  components:
  - type: GunAttachment
    attachedSprite:
      sprite: Ashfall/Objects/Weapons/Attachments/Suppressors/multi_cal.rsi
      state: multical_rifle
    attachedOffset: 0.5, 0
  - type: Sprite
    sprite: Ashfall/Objects/Weapons/Attachments/Suppressors/multi_cal.rsi
    state: multical_rifle
  - type: Tag
    tags:
    - GunAttachmentMuzzle
    - GunAttachmentMuzzleRifle
  - type: GunSoundAttachment
    sound:
      collection: Supressed_2_Gunshots

# Underbarrel / Grips
- type: entity
  parent: BaseGunAttachment
  id: AttachmentGripVFG
  components:
  - type: GunAttachment
    attachedSprite:
      sprite: Ashfall/Objects/Weapons/Attachments/Grips/erebus_railmount.rsi
      state: vfg
    attachedOffset: 0.25, -0.125
  - type: Sprite
    sprite: Ashfall/Objects/Weapons/Attachments/Grips/erebus_railmount.rsi
    state: vfg
  - type: Tag
    tags:
    - GunAttachmentUnderbarrel
  - type: GunRecoilAttachment
    recoilRecoveryModifier: 1.2
    recoilIncreaseModifier: 0.85
    minSpreadModifier: 0.75
    maxSpreadModifier: 0.8

- type: entity
  parent: BaseGunAttachment
  id: AttachmentLAM
  components:
  - type: GunAttachment
    attachedSprite:
      sprite: Ashfall/Objects/Weapons/Attachments/Grips/erebus_railmount.rsi
      state: lam
    attachedOffset: 0.25, -0.125
    hasUnshaded: true
  - type: Sprite
    sprite: Ashfall/Objects/Weapons/Attachments/Grips/erebus_railmount.rsi
    state: lam
  - type: Tag
    tags:
    - GunAttachmentUnderbarrel
  - type: GunRecoilAttachment
    minSpreadModifier: 0.9
    maxSpreadModifier: 0.9

