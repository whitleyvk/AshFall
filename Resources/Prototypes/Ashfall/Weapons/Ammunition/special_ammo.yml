# Cartridges
- type: entity
  parent: BaseCartridgePistol
  id: CartridgePistolPC
  name: cartridge-pistol-pc-name
  description: cartridge-pistol-pc-desc
  components:
  - type: CartridgeAmmo
    proto: BulletPistolPC
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Casings/ammo_casing.rsi
    layers:
    - state: base
      map: [ "enum.AmmoVisualLayers.Base" ]
      color: "#818181"
