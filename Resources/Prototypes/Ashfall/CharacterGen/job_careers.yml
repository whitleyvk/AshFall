# Playable-job side of the career model. Requirements and ceilings are per-competency career
# levels; eligibility is always derived from the finished person structure, never rolled.
# FallbackOnly jobs are suppressed while any non-fallback job is valid.

# Command

- type: ashfallJobCareer
  id: Captain
  domain: Command
  requiredCompetencies:
    Command: Experienced
    Administration: Qualified
  requiresLeadershipHistory: true

- type: ashfallJobCareer
  id: HeadOfPersonnel
  domain: Command
  requiredCompetencies:
    Command: Junior
    Administration: Qualified
    PersonnelManagement: Junior

