- type: entity
  id: OrganAnimalMetabolizer
  abstract: true
  components:
  - type: Metabolizer
    metabolizerTypes: [ Animal ]

- type: entity
  parent: OrganBaseOrganic
  id: OrganAnimal
  abstract: true
  suffix: Animal

- type: entity
  parent: OrganAnimal
  id: OrganAnimalInternal
  abstract: true
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/organs.rsi

- type: entity
  parent: [ OrganBaseLungs, OrganAnimalInternal, OrganAnimalMetabolizer ]
  id: OrganAnimalLungs

- type: entity
  parent: [ OrganBaseHeart, OrganAnimalInternal, OrganAnimalMetabolizer ]
  id: OrganAnimalHeart

- type: entity
  parent: [ OrganBaseStomach, OrganAnimalInternal, OrganAnimalMetabolizer ]
  id: OrganAnimalStomach

- type: entity
  parent: [ OrganAnimalInternal, OrganAnimalMetabolizer ]
  id: OrganAnimalLiver
  name: liver
  components:
  - type: GibbableOrgan
  - type: Organ
    category: Liver
  - type: Sprite
    layers:
    - state: liver
  - type: Item
    heldPrefix: liver
  - type: Metabolizer
    maxReagents: 1
    stages: [ Metabolites ]

- type: entity
  parent: [ OrganAnimalInternal, OrganAnimalMetabolizer ]
  id: OrganAnimalKidneys
  name: kidneys
  components:
  - type: GibbableOrgan
  - type: Organ
    category: Kidneys
  - type: Sprite
    layers:
    - state: kidney-l
    - state: kidney-r
  - type: Item
    heldPrefix: kidneys
  - type: Metabolizer
    maxReagents: 1
    stages: [ Metabolites ]

- type: entity
  id: BaseMobAnimal
  abstract: true
  components:
  - type: Body
  - type: EntityTableContainerFill
    containers:
      body_organs: !type:AllSelector
        children:
        - id: OrganAnimalLungs
        - id: OrganAnimalHeart
        - id: OrganAnimalStomach
        - id: OrganAnimalLiver
        - id: OrganAnimalKidneys
