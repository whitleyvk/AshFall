- type: entity
  abstract: true
  id: SurgeryStepBase
  components:
  - type: SurgeryStep

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepOpenIncisionScalpel
  name: Cut with a scalpel
  components:
  - type: SurgeryStep
    tool:
    - type: Scalpel
    add:
    - type: IncisionOpen
    duration: 2
  - type: Sprite
    sprite: _Trauma/Objects/Specific/Medical/Surgery/scalpel.rsi
    state: scalpel
  - type: SurgeryDamageChangeEffect
    damage:
      types:
        Bloodloss: 10
    sleepModifier: 0.5

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepClampBleeders
  name: Clamp the bleeders
  components:
  - type: SurgeryStep
    tool:
    - type: Hemostat
    add:
    - type: BleedersClamped
    duration: 4
  - type: Sprite
    sprite: _Trauma/Objects/Specific/Medical/Surgery/hemostat.rsi
    state: hemostat
  - type: SurgeryRepeatableStep
  - type: SurgeryBleedsTreatmentStep
    amount: 2

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepCloseBloodOutputs
  name: Stitch up destroyed tissues
  components:
  - type: SurgeryStep
    tool:
    - type: Stitches
    remove:
    - type: BleedersClamped
    duration: 5
  - type: Sprite
    sprite: _Trauma/Objects/Specific/Medical/Surgery/stitches.rsi
    state: stitches

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepRetractSkin
  name: Retract the skin
  components:
  - type: SurgeryStep
    tool:
    - type: Retractor
    add:
    - type: SkinRetracted
    duration: 2
  - type: Sprite
    sprite: _Trauma/Objects/Specific/Medical/Surgery/retractor.rsi
    state: retractor

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepRemoveSeveredSkin
  name: Remove the dead skin
  components:
  - type: SurgeryStep
    tool:
    - type: Scalpel
    add:
    - type: BodyPartSawed
    duration: 4
  - type: Sprite
    sprite: _Trauma/Objects/Specific/Medical/Surgery/scalpel.rsi
    state: scalpel

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepSawBones
  name: Saw through bones
  components:
  - type: SurgeryStep
    tool:
    - type: BoneSaw
    add:
    - type: BonesSawed
    duration: 4
  - type: Sprite
    sprite: _Trauma/Objects/Specific/Medical/Surgery/circular-saw.rsi
    state: circular-saw

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepRemoveLeftoverBones
  name: Clear up bone leftovers
  components:
  - type: SurgeryStep
    tool:
    - type: BoneSaw
    add:
    - type: BonesOpen
    duration: 5
  - type: Sprite
    sprite: _Trauma/Objects/Specific/Medical/Surgery/circular-saw.rsi
    state: circular-saw

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepMendBones
  name: Mend bones
  components:
  - type: SurgeryStep
    tool:
    - type: BoneGel
    duration: 7
  - type: SurgeryAffixPartStep
  - type: Sprite
    sprite: _Trauma/Objects/Specific/Medical/Surgery/bone-gel.rsi
    state: bone-gel
  - type: SurgeryRepeatableStep
  - type: SurgeryTraumaTreatmentStep
    traumaType: BoneDamage
    amount: 17

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepHealOrgans
  name: Heal Organs
  components:
  - type: SurgeryStep
    tool:
    - type: Tending
    duration: 7
  - type: SurgeryAffixOrganStep
  - type: Sprite
    sprite: _Trauma/Objects/Specific/Medical/Surgery/hemostat.rsi
    state: hemostat
  - type: SurgeryRepeatableStep
  - type: SurgeryTraumaTreatmentStep
    traumaType: OrganDamage
    amount: 17

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepPriseOpenBones
  name: Prise the bones open
  components:
  - type: SurgeryStep
    tool:
    - type: Retractor
    add:
    - type: BonesOpen
    duration: 2
  - type: Sprite
    sprite: _Trauma/Objects/Specific/Medical/Surgery/retractor.rsi
    state: retractor

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepCloseBones
  name: Close bones
  components:
  - type: SurgeryStep
    tool:
    - type: Retractor
    remove:
    - type: BonesOpen
    duration: 2
  - type: Sprite
    sprite: _Trauma/Objects/Specific/Medical/Surgery/retractor.rsi
    state: retractor

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepSealBones
  name: Seal bones
  components:
  - type: SurgeryStep
    tool:
    - type: BoneGel
    remove:
    - type: BonesSawed
    duration: 2
  - type: Sprite
    sprite: _Trauma/Objects/Specific/Medical/Surgery/bone-gel.rsi
    state: bone-gel

- type: entity
  parent: SurgeryStepSealBones
  id: SurgeryStepSealSkull
  name: Seal skull

- type: entity
  parent: SurgeryStepSealBones
  id: SurgeryStepSealRibcage
  name: Seal ribcage

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepCloseIncision
  name: Close incision
  components:
  - type: SurgeryStep
    tool:
    - type: Cautery
    remove:
    - type: SkinRetracted
    - type: BleedersClamped
    - type: IncisionOpen
    - type: OrganReattached
    - type: InternalBleedersClamped
    - type: TissueRearranged
    - type: VesselsStitched
    - type: JointCreated
    - type: JointStitched
    duration: 2
  - type: Sprite
    sprite: _Trauma/Objects/Specific/Medical/Surgery/cautery.rsi
    state: cautery
  - type: SurgeryDamageChangeEffect
    damage:
      types:
        Heat: -5
    sleepModifier: 2

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepInsertFeature
  name: Insert part
  components:
  - type: SurgeryStep
    tool:
    - type: BodyPart
      partType: Other
      slots: []
    duration: 6
  - type: Sprite
    sprite: _Trauma/Objects/Specific/Medical/Surgery/manipulation.rsi
    state: insertion
  - type: SurgeryAddPartStep

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepSealWounds
  name: Seal wounds
  components:
  - type: SurgeryStep
    tool:
    - type: Cautery
    remove:
    - type: SkinRetracted
    - type: BleedersClamped
    - type: IncisionOpen
    - type: InternalBleedersClamped
    - type: TissueRearranged
    - type: VesselsStitched
    - type: JointCreated
    - type: JointStitched
    duration: 2
  - type: SurgeryAffixPartStep
  - type: Sprite
    sprite: _Trauma/Objects/Specific/Medical/Surgery/cautery.rsi
    state: cautery
  - type: SurgeryDamageChangeEffect
    damage:
      types:
        Heat: -5
    sleepModifier: 2

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepSawFeature
  name: Saw through bones
  components:
  - type: SurgeryStep
    tool:
    - type: BoneSaw
    add:
    - type: BodyPartSawed
    duration: 4
  - type: Sprite
    sprite: _Trauma/Objects/Specific/Medical/Surgery/circular-saw.rsi
    state: circular-saw

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepClampInternalBleeders
  name: Clamp internal bleeders
  components:
  - type: SurgeryStep
    tool:
    - type: Hemostat
    add:
    - type: InternalBleedersClamped
    duration: 2
  - type: Sprite
    sprite: _Trauma/Objects/Specific/Medical/Surgery/hemostat.rsi
    state: hemostat
  - type: SurgeryDamageChangeEffect
    damage:
      types:
        Bloodloss: -5
    sleepModifier: 2

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepRemoveFeature
  name: Amputate part
  components:
  - type: SurgeryStep
    tool:
    - type: BoneSaw
    remove:
    - type: SkinRetracted
    - type: BleedersClamped
    - type: InternalBleedersClamped
    - type: IncisionOpen
    duration: 8
  - type: Sprite
    sprite: _Trauma/Objects/Specific/Medical/Surgery/circular-saw.rsi
    state: circular-saw
  - type: SurgeryRemovePartStep

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepCarefulIncisionScalpel
  name: Make a careful incision
  components:
  - type: SurgeryStep
    tool:
    - type: Scalpel
    add:
    - type: IncisionOpen
    duration: 3
  - type: Sprite
    sprite: _Trauma/Objects/Specific/Medical/Surgery/scalpel.rsi
    state: scalpel

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepRepairBruteTissue
  name: Repair damaged tissue
  components:
  - type: SurgeryStep
    tool:
    - type: Tending
    duration: 1
  - type: Sprite
    sprite: _Trauma/Objects/Specific/Medical/Surgery/hemostat.rsi
    state: hemostat
  - type: SurgeryTendWoundsEffect
    damage:
      types:
        Blunt: -5
        Slash: -5
        Piercing: -5
        Ballistic: -5
  - type: SurgeryRepeatableStep

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepRepairBurnTissue
  name: Repair burnt tissue
  components:
  - type: SurgeryStep
    tool:
    - type: Tending
    duration: 1
  - type: Sprite
    sprite: _Trauma/Objects/Specific/Medical/Surgery/hemostat.rsi
    state: hemostat
  - type: SurgeryTendWoundsEffect
    mainGroup: Burn
    damage:
      types:
        Heat: -5
        Cold: -5
        Shock: -5
        Caustic: -5
  - type: SurgeryRepeatableStep

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepSealTendWound
  name: Seal the wound
  components:
  - type: SurgeryStep
    tool:
    - type: Cautery
    remove:
    - type: IncisionOpen
    duration: 2
  - type: Sprite
    sprite: _Trauma/Objects/Specific/Medical/Surgery/cautery.rsi
    state: cautery
  - type: SurgeryDamageChangeEffect
    damage:
      types:
        Heat: -5
    sleepModifier: 2

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepSealDismembermentWound
  name: Stitch up the dismemberment wound
  components:
  - type: SurgeryStep
    tool:
    - type: Stitches
    remove:
    - type: IncisionOpen
    duration: 8
  - type: Sprite
    sprite: _Trauma/Objects/Specific/Medical/Surgery/stitches.rsi
    state: stitches
  - type: SurgeryTraumaTreatmentStep
    traumaType: Dismemberment

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepInsertItem
  name: Insert item into cavity
  components:
  - type: SurgeryStep
    duration: 4
  - type: Sprite
    sprite: _Trauma/Objects/Specific/Medical/Surgery/manipulation.rsi
    state: insertion
  - type: SurgeryStepCavityEffect
    action: Insert

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepRemoveItem
  name: Remove item from cavity
  components:
  - type: SurgeryStep
    duration: 4
  - type: Sprite
    sprite: _Trauma/Objects/Specific/Medical/Surgery/manipulation.rsi
    state: insertion
  - type: SurgeryStepCavityEffect
    action: Remove

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepRemoveOrgan
  name: Remove organ
  components:
  - type: SurgeryStep
    tool:
    - type: Tweezers
    duration: 8
  - type: Sprite
    sprite: _Trauma/Objects/Specific/Medical/Surgery/hemostat.rsi
    state: hemostat
  - type: SurgeryRemoveOrganStep

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepInsertOrgan
  name: Add organ
  components:
  - type: SurgeryStep
    tool:
    - type: InternalChildOrgan
    duration: 6
  - type: Sprite
    sprite: _Trauma/Objects/Specific/Medical/Surgery/manipulation.rsi
    state: insertion
  - type: SurgeryAddOrganStep

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepOpenOrganSlot
  name: Carve out a cavity
  components:
  - type: SurgeryStep
    tool:
    - type: Scalpel
    duration: 6
  - type: Sprite
    sprite: _Trauma/Objects/Specific/Medical/Surgery/manipulation.rsi
    state: insertion
  - type: SurgeryAddOrganSlotStep

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepSealOrganWound
  name: Seal wounds
  components:
  - type: SurgeryStep
    tool:
    - type: Cautery
    duration: 2
  - type: SurgeryAffixOrganStep
  - type: Sprite
    sprite: _Trauma/Objects/Specific/Medical/Surgery/cautery.rsi
    state: cautery
  - type: SurgeryDamageChangeEffect
    damage:
      types:
        Heat: -5
    sleepModifier: 2
