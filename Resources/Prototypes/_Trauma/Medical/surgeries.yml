    inverse: true
    reattaching: true

- type: entity
  abstract: true
  parent: BaseSurgeryInsertOrgan
  id: BaseSurgeryInsertOrganChest
  components:
  - type: Surgery
    requirement: SurgeryOpenRibcage

- type: entity
  abstract: true
  parent: SurgeryBase
  id: BaseSurgeryRemoveOrgan
  components:
