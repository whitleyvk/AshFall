# Melee Combat

- type: entity
  abstract: true
  parent: BaseWarKnowledge
  id: BaseKnowledgeWeaponsMelee
  components:
  - type: Knowledge
    category: MeleeCombat
    costs: [0, 2, 6]

- type: entity
  parent: BaseKnowledgeWeaponsMelee
  id: MeleeKnowledge
  name: Unarmed Training
  description: How good you are at punching others, usually with your bare hands or claws.
  components:
  - type: MeleeSpeedKnowledge
    curve: !type:CubicSkillCurve
      skillOffset: 0.5
      curveOffset: 1
      curveScale: 0.5
  - type: MeleeDamageKnowledge
    curve: !type:CubicSkillCurve
      skillScale: 1.13
      skillOffset: -0.5
      curveOffset: 1

- type: entity
  parent: BaseKnowledgeWeaponsMelee
  id: KnowledgeWeaponsBludgeon
  name: Bludgeons Training
  description: Swinging heavy clubs, bats and what not really fast hurts your foes.

- type: entity
  parent: BaseKnowledgeWeaponsMelee
  id: KnowledgeWeaponsShortBlade
  name: Short Blade Training
  description: Using knives and other small blades effectively needs quick and powerful stabs and cuts.

- type: entity
  parent: BaseKnowledgeWeaponsMelee
  id: KnowledgeWeaponsLongBlade
  name: Long Blade Training
  description: Large blades are best used by stabbing and slashing your enemies, with enough heft to even parry attacks.

- type: entity
  parent: BaseKnowledgeWeaponsMelee
  id: KnowledgeWeaponsPolearm
  name: Polearm Training
  description: Humanity started putting pokey bits on sticks tens of thousands of years ago. Puncture your foes with strong thrusts.

- type: entity
  parent: BaseKnowledgeWeaponsMelee
  id: KnowledgeWeaponsNonLethal
  name: Non-lethals Training
  description: It takes skill to attack someone. It takes more to attack without killing, like with stun batons or disablers.

- type: entity
  parent: BaseKnowledgeWeaponsMelee
  id: KnowledgeWeaponsTool
  name: Tool Combat Training
  description: Most laymen think it's easy to fight with hedge trimmers and nailguns, a real tradie knows the secret to it.

- type: entity
  parent: BaseKnowledgeWeaponsMelee
  id: KnowledgeWeaponsShield
  name: Shield Training
  description: Allows you to parry and block damage better with shields.
  components:
  - type: Knowledge
    unremoveable: true
  - type: BlockFractionKnowledge
    curve: !type:RootSkillCurve
      skillScale: 100
      curveOffset: 0.7
      curveScale: 0.06

- type: entity
  parent: BaseKnowledgeWeaponsMelee
  id: KnowledgeWeaponsEnergy
  name: Energy Weapon Training
  description: Modern energy weapons are highly dangerous and unintuitive, it takes lots of training to use them correctly.
  components:
  - type: Knowledge
    costs: null

# Ranged Combat

- type: entity
  abstract: true
  parent: BaseWarKnowledge
  id: BaseKnowledgeWeaponsRanged
  components:
  - type: Knowledge
    category: RangedCombat
    costs: [0, 2, 6]

- type: entity
  parent: BaseKnowledgeWeaponsRanged
  id: ShootingKnowledge
  name: Marksmanship
  description: How good your aim is with most guns. Training with the relevant weapon is much better, but a good eye puts you ahead of the rest.
  components:
  - type: Knowledge
    unremoveable: true
  - type: AimSpeedKnowledge
    curve: !type:LinearSkillCurve
      skillScale: 1.5
      skillOffset: 0.35

- type: entity
  parent: BaseKnowledgeWeaponsRanged
  id: KnowledgeWeaponsPistol
  name: Pistol Training
  description: How good you are with one-handed ballistics. Mostly magazines and revolver cylinders.

- type: entity
  parent: BaseKnowledgeWeaponsRanged
  id: KnowledgeWeaponsRifle
  name: Longarm Training
  description: How good you are with ballistic long arms like assault rifles and mosins.

- type: entity
  parent: BaseKnowledgeWeaponsRanged
  id: KnowledgeWeaponsSMG
  name: SMG Training
  description: How good you are with ballistic sub machine guns.

- type: entity
  parent: BaseKnowledgeWeaponsRanged
  id: KnowledgeWeaponsShotgun
  name: Shotgun Training
  description: You know why I use the shotgun? The shotgun doesn't miss.

- type: entity
  parent: BaseKnowledgeWeaponsRanged
  id: KnowledgeWeaponsLaser
  name: Lasers Training
  description: Laser weapons have little recoil, what matters more is heat management. NanoTrasen's choice purely for its low cost.

- type: entity
  parent: BaseKnowledgeWeaponsRanged
  id: ThrowingKnowledge
  name: Throwing
  description: Makes you throw items faster and with more precision.
  components:
  - type: Knowledge
    unremoveable: true
    experienceCost: 5
  - type: ThrowInsertKnowledge
    curve: !type:QuadraticSkillCurve

# Physical

- type: entity
  parent: BasePhysicalKnowledge
  id: AthleticsKnowledge
  name: Athletics
  description: Physical conditioning that increases stamina endurance.
  components:
  - type: Knowledge
    experienceCost: 12
  - type: StaminaKnowledge
    curve: !type:QuadraticSkillCurve
      skillScale: 0.6
      skillOffset: -2.8
      curveScale: 0.05
      curveOffset: 0.6

- type: entity
  parent: BasePhysicalKnowledge
  id: StrengthKnowledge
  name: Strength
  description: Physical power that increases melee impact.
  components:
  - type: Knowledge
    experienceCost: 12
  - type: MeleeDamageKnowledge
    curve: !type:CubicSkillCurve
      skillScale: 1.13
      skillOffset: -0.5
      curveOffset: 1
