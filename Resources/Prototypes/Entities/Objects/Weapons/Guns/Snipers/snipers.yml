- type: entity
  name: BaseWeaponSniper
  parent: BaseItem
  id: BaseWeaponSniper
  description: A rooty tooty point and shooty.
  abstract: true
  components:
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
  - type: Item
    size: Large
  - type: Clothing
    sprite: Objects/Weapons/Guns/Snipers/bolt_gun_wood.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: WeaponClass
    class: Rifle
  - type: MeleeWeapon
    soundHit:
      collection: MetalThud
    damage:
      types:
        Blunt: 12
  - type: AltFireMelee
    attackType: Light
  - type: AttachableGun
    slots:
    - name: gun-slot-muzzle
      containerId: attachment_muzzle
      whitelist:
        tags:
        - GunAttachmentMuzzleRifle
    - name: gun-slot-underbarrel
      containerId: attachment_underbarrel
      whitelist:
        tags:
        - GunAttachmentUnderbarrel
    - name: gun-slot-optic
      containerId: attachment_optic
      whitelist:
        tags:
        - GunAttachmentOptic
  - type: AmmoCounter
  - type: Gun
    fireRate: 0.75
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      collection: Dmr_1_Gunshots
  - type: EmitSoundOnPickup
    sound:
      collection: GunPickupSoundCollection
  - type: EmitSoundOnDrop
    sound:
      collection: GunDropSoundCollection
  - type: BallisticAmmoProvider
    capacity: 10
    proto: CartridgeLightRifle
    whitelist:
      tags:
      - CartridgeLightRifle
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
        ents: []
  - type: StaticPrice
    price: 500

- type: entity
  name: Kardashev-Mosin
  parent: [BaseWeaponSniper, BaseGunWieldable, SolutionDart, BaseMajorContraband]
  id: WeaponSniperMosin
  description: A true relic, the Kardashev-Mosin has served in nearly every armed conflict since its creation 670 years ago. The bolt-action design of the rifle remains virtually identical to its original design, whether used for hunting, sniping, or endless trench warfare. Loads 10 rounds of .30 rifle.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Snipers/bolt_gun_wood.rsi
    layers:
    - state: base
    - state: base1
      map: [ "enum.SolutionContainerLayers.Fill" ]
      visible: false
  - type: Appearance
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    fillBaseName: base
    inHandsFillBaseName: -fill-
    inHandsMaxFillLevels: 1
    equippedFillBaseName: -fill-
    equippedMaxFillLevels: 1
  - type: MeleeWeapon
    wideAnimationRotation: -135
    damage:
      types:
        Piercing: 12
    angle: 0
    animation: WeaponArcThrust
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: MeleeRequiresWield
  - type: AltFireMelee
    attackType: Heavy
  - type: MeleeChemicalInjector
    solution: melee
  - type: RefillableSolution
    solution: melee
  - type: InjectableSolution
    solution: melee
  - type: SolutionTransfer
    maxTransferAmount: 2
  - type: Tool
    qualities: [ Slicing ]
    speedModifier: 0.5 #It's a bayonet
  - type: GunRequiresWield
  - type: StaticPrice
    price: 500

  - type: AttachableGun
    visuals:
      attachment_underbarrel:
        offset: -0.03125, 0.28125
        rotation: 45
        layerAnchor: top
        layerPosition: After
        drawOrder: 0
      attachment_muzzle:
        offset: -0.0625, 0.59375
        rotation: 45
        layerAnchor: top
        layerPosition: After
        drawOrder: 0
- type: entity
  name: Hristov
  parent: [BaseWeaponSniper, BaseGunWieldable, BaseSyndicateContraband]
  id: WeaponSniperHristov
  description: For when you absolutely, positively need to make someone regret their life choices from a safe distance. Uses .60 anti-materiel ammo.
  components:
  - type: Item
    size: Huge
    shape:
    - 0,0,5,1
  - type: Sprite
    sprite: Objects/Weapons/Guns/Snipers/heavy_sniper.rsi
  - type: Clothing
    sprite: Objects/Weapons/Guns/Snipers/heavy_sniper.rsi
  - type: GunRequiresWield
  - type: Gun
    fireRate: 0.5
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      collection: AmrGunshot
  - type: CustomSpriteAmmoCounter
    loadedAmmoSprite: Interface/ItemStatus/Sniper_Cartriges/not_spent.png
    spentAmmoSprite: Interface/ItemStatus/Sniper_Cartriges/spent.png
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - CartridgeAntiMateriel
    capacity: 5
    proto: CartridgeAntiMateriel
  - type: SpeedModifiedOnWield
    walkModifier: 0.25
    sprintModifier: 0.25
  - type: CursorOffsetRequiresWield
  - type: EyeCursorOffset
    maxOffset: 3
    pvsIncrease: 0.3
  - type: StaticPrice
    price: 3500

  - type: AttachableGun
    visuals:
      attachment_underbarrel:
        offset: 0.09375, 0.28125
        rotation: 45
        layerAnchor: top
        layerPosition: After
        drawOrder: 0
      attachment_muzzle:
        offset: 0.09375, 0.625
        rotation: 45
        layerAnchor: top
        layerPosition: After
        drawOrder: 0
- type: entity
  name: musket
  parent: [ BaseWeaponSniper, BaseGunWieldable, BaseMajorContraband ]
  id: Musket
  description: This should've been in a museum long before you were born. Uses .60 anti-materiel ammo.
  components:
  - type: Tool
    qualities:
    - Slicing
  - type: Item
    size: Large
  - type: Sprite
    sprite: Objects/Weapons/Guns/Snipers/musket.rsi
    state: base
  - type: Clothing
    sprite: Objects/Weapons/Guns/Snipers/musket.rsi
  - type: Gun
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
  - type: UseDelayOnShoot
  - type: UseDelay
    delay: 8 #it's a musket
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - CartridgeAntiMateriel
    capacity: 1
    proto: CartridgeAntiMateriel
  - type: MeleeWeapon
    wideAnimationRotation: -135
    damage:
      types:
        Piercing: 15 #you fucking stab em
        Bloodloss: 2 #no way to apply bleed, triangular bayonet wounds are hard to fix(source:that one copypasta)
    angle: 0
    animation: WeaponArcThrust
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: GunRequiresWield

  - type: AttachableGun
    compatibility:
      attachment_underbarrel:
        allowedAttachments: []
        deniedAttachments: ["AttachmentLAM"]
    visuals:
      attachment_underbarrel:
        offset: -0.03125, 0.28125
        rotation: 45
        layerAnchor: top
        layerPosition: After
        drawOrder: 0
      attachment_muzzle:
        offset: 0, 0.65625
        rotation: 45
        layerAnchor: top
        layerPosition: After
        drawOrder: 0
- type: entity
  name: flintlock pistol
  parent: [BaseWeaponSniper, BaseMajorContraband]
  id: WeaponPistolFlintlock
  description: A pirate's companion. Yarrr! Uses .45 magnum ammo.
  components:
  - type: Gun
    minAngle: 0
    maxAngle: 30 #miss him entirely because the barrel is smoothbore
  - type: Item
    size: Small
    shape:
    - 0,0,1,0
    - 0,1,0,1
    storedOffset: 0,-5
  - type: Sprite
    sprite: Objects/Weapons/Guns/Snipers/flintlock.rsi
  - type: Clothing
    sprite: Objects/Weapons/Guns/Snipers/flintlock.rsi
  - type: UseDelayOnShoot
  - type: UseDelay
    delay: 8 #it's a flintlock
  - type: BallisticAmmoProvider
    whitelist:
      tags:
        - CartridgeMagnum # changed from Anti-material rifle rounds because it's a flintlock pistol not a Hristov
    capacity: 1
    proto: CartridgeMagnum
  - type: StaticPrice
