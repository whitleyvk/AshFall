  - type: AttachableGun
    visuals:
      attachment_muzzle:
        offset: 0.1875, 0.125
        rotation: 0
        layerAnchor: top
        layerPosition: After
        drawOrder: 0
      attachment_underbarrel:
        offset: 0, 0.09375
        rotation: 0
        layerAnchor: top
        layerPosition: After
        drawOrder: 0
